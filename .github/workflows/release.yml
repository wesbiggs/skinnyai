name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - name: Test the built CLI
        run: npx vitest run test/cli.test.js
        env:
          SKINNYAI_SCRIPT: ${{ github.workspace }}/bin/skinnyai.js
      - name: Stage release files
        run: |
          mkdir release
          cp bin/skinnyai.js release/skinnyai.js
          (cd release && shasum -a 256 skinnyai.js > skinnyai.js.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --title "$GITHUB_REF_NAME"
